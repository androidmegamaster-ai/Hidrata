<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hidrata</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hidrata">
<meta name="theme-color" content="#eaf6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06141c" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config = { darkMode: 'media' }</script>

<style>
  :root {
    --bg: #eaf6fb; --card: #ffffff; --ink: #0b2a38; --mute: #5d7886;
    --accent: #0ea5d9; --accent2: #5fd0f0; --line: rgba(11,42,56,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #06141c; --card: #0e2430; --ink: #e8f6fc; --mute: #8fb0c0;
            --accent: #38bdf8; --accent2: #7dd3fc; --line: rgba(255,255,255,.08); }
  }
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, #root { height: 100%; margin: 0; }
  html { background: var(--bg); }
  body {
    overscroll-behavior: none; position: fixed; inset: 0; width: 100%;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  input { -webkit-user-select: text; user-select: text; font-size: 16px; } /* 16px evita zoom do iOS */
  .app { height: 100%; display: flex; flex-direction: column;
         padding-top: env(safe-area-inset-top, 0px); }
  .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
            padding: 8px 20px 24px; }
  .card { background: var(--card); border-radius: 24px; padding: 18px; border: 1px solid var(--line); }
  .tabbar { display: flex; background: color-mix(in srgb, var(--card) 85%, transparent);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--line);
            padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
         font-size: 11px; font-weight: 600; color: var(--mute); background: none; border: 0; padding: 6px 0; }
  .tab.on { color: var(--accent); }
  .press { transition: transform .12s cubic-bezier(.3,.7,.4,1), filter .12s; }
  .press:active { transform: scale(.94); filter: brightness(.95); }
  .ring { transition: stroke-dashoffset .9s cubic-bezier(.22,1,.36,1); }
  .bar { transition: height .7s cubic-bezier(.22,1,.36,1); }
  @keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.08) } 100% { transform: scale(1) } }
  .pop { animation: pop .35s ease-out; }
  .field { width: 100%; background: transparent; border: 0; outline: 0; text-align: right;
           color: var(--ink); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .ring, .bar, .pop { transition: none; animation: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------- Ícones (mesmos traçados do Lucide, inline p/ funcionar offline) ---------- */
const P = {
  droplet: <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>,
  bell: <><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></>,
  sliders: <><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/></>,
  chart: <><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></>,
  undo: <><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></>,
  plus: <path d="M5 12h14M12 5v14"/>,
  alert: <><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></>,
  share: <><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4M12 2v13"/></>,
  check: <path d="M20 6 9 17l-5-5"/>,
};
const Icon = ({ n, size = 22, sw = 2, className = "" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={className}>{P[n]}</svg>
);

/* ---------- Utilidades ---------- */
const dayKey = (d = new Date()) => d.toLocaleDateString("sv"); // YYYY-MM-DD local
const load = (k, f) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? f; } catch { return f; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fmt = (min) => `${String(Math.floor(min / 60) % 24).padStart(2, "0")}:${String(Math.round(min % 60)).padStart(2, "0")}`;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch {} };
const storageOK = (() => { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch { return false; } })();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}

const DEFAULTS = { weight: 70, manual: false, manualGoal: 2500, wake: "07:00", sleep: "23:00", notify: false };

function calcGoal(s) { return s.manual ? s.manualGoal : Math.round((s.weight * 35) / 50) * 50; }
function calcSchedule(s, goal) {
  const a = toMin(s.wake), b = toMin(s.sleep);
  if (b <= a) return [];
  const n = Math.min(14, Math.max(4, Math.ceil(goal / 250)));
  const step = (b - a) / n;
  return Array.from({ length: n }, (_, i) => Math.round(a + step * (i + 1) - step / 2));
}

async function notify(title, body) {
  try {
    const reg = await navigator.serviceWorker?.ready;
    if (reg) return reg.showNotification(title, { body, icon: "icon-180.png", badge: "icon-180.png", tag: "hidrata" });
    new Notification(title, { body, icon: "icon-180.png" });
  } catch {}
}

/* ---------- App ---------- */
function App() {
  const [tab, setTab] = useState("hoje");
  const [s, setS] = useState(() => ({ ...DEFAULTS, ...load("hidrata_settings", {}) }));
  const [logs, setLogs] = useState(() => load("hidrata_logs", {}));
  const [perm, setPerm] = useState(typeof Notification !== "undefined" ? Notification.permission : "unsupported");
  const [pop, setPop] = useState(0);

  const goal = calcGoal(s);
  const today = dayKey();
  const entries = logs[today] || [];
  const total = entries.reduce((a, b) => a + b, 0);
  const pct = Math.min(1, total / goal);
  const schedule = useMemo(() => calcSchedule(s, goal), [s.wake, s.sleep, goal]);

  useEffect(() => save("hidrata_settings", s), [s]);
  useEffect(() => save("hidrata_logs", logs), [logs]);

  const add = (ml) => { buzz(); setPop(p => p + 1); setLogs(l => ({ ...l, [today]: [...(l[today] || []), ml] })); };
  const undo = () => { buzz(); setLogs(l => ({ ...l, [today]: (l[today] || []).slice(0, -1) })); };

  /* Verificador de lembretes: roda enquanto o app está aberto/em primeiro plano */
  const stateRef = useRef({});
  stateRef.current = { s, schedule, total, goal, perm };
  useEffect(() => {
    const check = () => {
      const { s, schedule, total, goal, perm } = stateRef.current;
      if (!s.notify || perm !== "granted" || total >= goal) return;
      const d = new Date(), now = d.getHours() * 60 + d.getMinutes(), key = dayKey(d);
      let sent = load("hidrata_sent", { day: key, t: [] });
      if (sent.day !== key) sent = { day: key, t: [] };
      const due = schedule.filter(t => t <= now && !sent.t.includes(t));
      if (!due.length) return;
      const last = due[due.length - 1];
      sent.t = [...sent.t, ...due]; save("hidrata_sent", sent);
      if (now - last <= 45) {
        const falta = Math.max(0, goal - total);
        notify("💧 Hora de beber água", `Faltam ${falta} ml para a meta de hoje.`);
      }
    };
    check();
    const id = setInterval(check, 30000);
    const vis = () => document.visibilityState === "visible" && check();
    document.addEventListener("visibilitychange", vis);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", vis); };
  }, []);

  const enableNotif = async () => {
    if (typeof Notification === "undefined") return;
    const r = await Notification.requestPermission();
    setPerm(r);
    if (r === "granted") { setS(x => ({ ...x, notify: true })); notify("Lembretes ativados", "Vamos te avisar para beber água."); }
  };

  return (
    <div className="app">
      <header style={{ padding: "10px 20px 4px" }}>
        <h1 style={{ fontSize: 34, fontWeight: 800, letterSpacing: -0.5, margin: 0 }}>
          {tab === "hoje" ? "Hoje" : tab === "hist" ? "Histórico" : "Ajustes"}
        </h1>
        <p style={{ margin: "2px 0 0", color: "var(--mute)", fontSize: 14 }}>
          {new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" })}
        </p>
      </header>

      <main className="scroll">
        {!storageOK && (
          <div className="card" style={{ display: "flex", gap: 12, marginBottom: 16, background: "color-mix(in srgb, #ef4444 14%, var(--card))" }}>
            <Icon n="alert" className="shrink-0" />
            <div style={{ fontSize: 14, lineHeight: 1.4 }}><b>Este ambiente não permite salvar dados.</b> Os registros serão perdidos ao sair. Abra o app pelo seu endereço HTTPS no Safari ou pelo ícone da Tela de Início.</div>
          </div>
        )}
        {tab === "hoje" && <Today {...{ total, goal, pct, add, undo, entries, schedule, pop, s, perm, enableNotif }} />}
        {tab === "hist" && <History logs={logs} goal={goal} />}
        {tab === "ajustes" && <Settings {...{ s, setS, goal, schedule, perm, enableNotif }} />}
      </main>

      <nav className="tabbar">
        {[["hoje", "droplet", "Hoje"], ["hist", "chart", "Histórico"], ["ajustes", "sliders", "Ajustes"]].map(([k, ic, lb]) => (
          <button key={k} className={"tab press " + (tab === k ? "on" : "")} onClick={() => { buzz(); setTab(k); }}>
            <Icon n={ic} size={24} />{lb}
          </button>
        ))}
      </nav>
    </div>
  );
}

function InstallNotice({ perm, enableNotif, s }) {
  if (isIOS && !isStandalone())
    return (
      <div className="card" style={{ display: "flex", gap: 12, marginBottom: 16, background: "color-mix(in srgb, #f59e0b 14%, var(--card))" }}>
        <Icon n="alert" className="shrink-0" />
        <div style={{ fontSize: 14, lineHeight: 1.4 }}>
          <b>Instale para receber lembretes.</b> No iPhone, notificações só funcionam com o app na Tela de Início: toque em <Icon n="share" size={15} className="inline -mt-1" /> Compartilhar → <b>Adicionar à Tela de Início</b> e abra por lá.
        </div>
      </div>
    );
  if (perm === "default" || (perm === "granted" && !s.notify))
    return (
      <button onClick={enableNotif} className="card press" style={{ width: "100%", display: "flex", gap: 12, alignItems: "center", marginBottom: 16, textAlign: "left", color: "var(--ink)" }}>
        <Icon n="bell" /><span style={{ fontSize: 15, fontWeight: 600 }}>Ativar lembretes de água</span>
      </button>
    );
  if (perm === "denied")
    return <div className="card" style={{ fontSize: 14, marginBottom: 16 }}>Notificações bloqueadas. Ative em Ajustes do iPhone → Notificações → Hidrata.</div>;
  return null;
}

function Today({ total, goal, pct, add, undo, entries, schedule, pop, s, perm, enableNotif }) {
  const R = 100, C = 2 * Math.PI * R;
  const nextT = schedule.find(t => { const d = new Date(); return t > d.getHours() * 60 + d.getMinutes(); });
  return (
    <>
      <InstallNotice {...{ perm, enableNotif, s }} />
      <div className="card" style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "26px 18px" }}>
        <div key={pop} className={pop ? "pop" : ""} style={{ position: "relative", width: 240, height: 240 }}>
          <svg width="240" height="240" viewBox="0 0 240 240" style={{ transform: "rotate(-90deg)" }}>
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stopColor="var(--accent2)" /><stop offset="1" stopColor="var(--accent)" /></linearGradient></defs>
            <circle cx="120" cy="120" r={R} fill="none" stroke="var(--line)" strokeWidth="18" />
            <circle className="ring" cx="120" cy="120" r={R} fill="none" stroke="url(#g)" strokeWidth="18"
              strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C * (1 - pct)} />
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
            <Icon n={pct >= 1 ? "check" : "droplet"} size={26} className="" />
            <div style={{ fontSize: 44, fontWeight: 800, letterSpacing: -1, lineHeight: 1.1 }}>{total}<span style={{ fontSize: 18, color: "var(--mute)", fontWeight: 600 }}> ml</span></div>
            <div style={{ color: "var(--mute)", fontSize: 14 }}>de {goal} ml · {Math.round(pct * 100)}%</div>
          </div>
        </div>
        <p style={{ margin: "14px 0 0", color: "var(--mute)", fontSize: 14, textAlign: "center" }}>
          {pct >= 1 ? "Meta batida! Ótimo trabalho." : nextT != null && s.notify ? `Próximo lembrete às ${fmt(nextT)}` : `Faltam ${goal - total} ml`}
        </p>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12, margin: "16px 0" }}>
        {[250, 300, 500].map(ml => (
          <button key={ml} onClick={() => add(ml)} className="press"
            style={{ height: 96, borderRadius: 24, border: 0, color: "#fff", fontWeight: 800,
                     background: "linear-gradient(160deg, var(--accent2), var(--accent))",
                     boxShadow: "0 8px 20px -8px var(--accent)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2 }}>
            <Icon n="plus" size={18} sw={3} /><span style={{ fontSize: 22 }}>{ml}</span><span style={{ fontSize: 12, opacity: .85, marginTop: -4 }}>ml</span>
          </button>
        ))}
      </div>

      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: entries.length ? 10 : 0 }}>
          <b style={{ fontSize: 17 }}>Registros de hoje</b>
          <button onClick={undo} disabled={!entries.length} className="press"
            style={{ background: "none", border: 0, color: "var(--accent)", fontWeight: 600, opacity: entries.length ? 1 : .35, display: "flex", gap: 4, alignItems: "center", fontSize: 15 }}>
            <Icon n="undo" size={16} /> Desfazer
          </button>
        </div>
        {entries.length === 0
          ? <p style={{ color: "var(--mute)", margin: "8px 0 0", fontSize: 14 }}>Toque em um botão acima quando beber água.</p>
          : <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {entries.map((e, i) => <span key={i} style={{ background: "var(--line)", borderRadius: 999, padding: "6px 12px", fontSize: 14, fontWeight: 600 }}>{e} ml</span>)}
            </div>}
      </div>
    </>
  );
}

function History({ logs, goal }) {
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i));
    const k = dayKey(d); const t = (logs[k] || []).reduce((a, b) => a + b, 0);
    return { k, t, label: d.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", ""), isToday: i === 6 };
  });
  const max = Math.max(goal, ...days.map(d => d.t));
  const hit = days.filter(d => d.t >= goal).length;
  const avg = Math.round(days.reduce((a, d) => a + d.t, 0) / 7);
  return (
    <>
      <div className="card">
        <div style={{ display: "flex", alignItems: "flex-end", gap: 8, height: 190, position: "relative" }}>
          <div style={{ position: "absolute", left: 0, right: 0, bottom: `calc(${(goal / max) * 100}% * 0.86 + 22px)`, borderTop: "1.5px dashed var(--mute)", opacity: .5 }} />
          {days.map(d => (
            <div key={d.k} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", height: "100%", gap: 6 }}>
              <div style={{ width: "100%", height: "86%", display: "flex", alignItems: "flex-end" }}>
                <div className="bar" style={{ width: "100%", height: `${(d.t / max) * 100}%`, minHeight: d.t ? 6 : 3, borderRadius: 10,
                  background: d.t >= goal ? "linear-gradient(var(--accent2), var(--accent))" : d.isToday ? "var(--accent2)" : "var(--line)" }} />
              </div>
              <span style={{ fontSize: 12, fontWeight: d.isToday ? 800 : 500, color: d.isToday ? "var(--accent)" : "var(--mute)" }}>{d.label}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, margin: "16px 0" }}>
        <div className="card"><div style={{ color: "var(--mute)", fontSize: 13 }}>Média diária</div><div style={{ fontSize: 26, fontWeight: 800 }}>{avg} ml</div></div>
        <div className="card"><div style={{ color: "var(--mute)", fontSize: 13 }}>Metas batidas</div><div style={{ fontSize: 26, fontWeight: 800 }}>{hit}/7</div></div>
      </div>
      <div className="card">
        {[...days].reverse().map((d, i, a) => (
          <div key={d.k} style={{ display: "flex", justifyContent: "space-between", padding: "11px 0", borderBottom: i < a.length - 1 ? "1px solid var(--line)" : 0, fontSize: 15 }}>
            <span>{new Date(d.k + "T12:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "short" })}</span>
            <b style={{ color: d.t >= goal ? "var(--accent)" : "var(--ink)" }}>{d.t} ml</b>
          </div>
        ))}
      </div>
    </>
  );
}

function Row({ label, children }) {
  return <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 0", borderBottom: "1px solid var(--line)", gap: 12 }}>
    <span style={{ fontSize: 16 }}>{label}</span><div style={{ minWidth: 90, textAlign: "right" }}>{children}</div></div>;
}

function Settings({ s, setS, goal, schedule, perm, enableNotif }) {
  const up = (k, v) => setS(x => ({ ...x, [k]: v }));
  const Toggle = ({ on, set }) => (
    <button onClick={() => set(!on)} className="press" aria-pressed={on}
      style={{ width: 51, height: 31, borderRadius: 999, border: 0, background: on ? "var(--accent)" : "var(--line)", position: "relative", transition: "background .2s" }}>
      <span style={{ position: "absolute", top: 2, left: on ? 22 : 2, width: 27, height: 27, borderRadius: "50%", background: "#fff", transition: "left .2s", boxShadow: "0 2px 4px rgba(0,0,0,.25)" }} />
    </button>);
  return (
    <>
      <div className="card" style={{ padding: "6px 18px" }}>
        <Row label="Meta manual"><Toggle on={s.manual} set={v => up("manual", v)} /></Row>
        {s.manual
          ? <Row label="Meta (ml)"><input className="field" type="number" inputMode="numeric" value={s.manualGoal} onChange={e => up("manualGoal", Math.max(500, +e.target.value || 0))} /></Row>
          : <Row label="Peso (kg)"><input className="field" type="number" inputMode="decimal" value={s.weight} onChange={e => up("weight", Math.max(20, +e.target.value || 0))} /></Row>}
        <div style={{ padding: "12px 0", color: "var(--mute)", fontSize: 14 }}>
          Meta diária: <b style={{ color: "var(--accent)" }}>{goal} ml</b>{!s.manual && " (35 ml por kg)"}
        </div>
      </div>

      <div className="card" style={{ padding: "6px 18px", marginTop: 16 }}>
        <Row label="Acordo às"><input className="field" type="time" value={s.wake} onChange={e => up("wake", e.target.value)} /></Row>
        <Row label="Durmo às"><input className="field" type="time" value={s.sleep} onChange={e => up("sleep", e.target.value)} /></Row>
        <Row label="Lembretes">
          <Toggle on={s.notify && perm === "granted"} set={v => v ? (perm === "granted" ? up("notify", true) : enableNotif()) : up("notify", false)} />
        </Row>
        <div style={{ padding: "12px 0" }}>
          <div style={{ color: "var(--mute)", fontSize: 14, marginBottom: 8 }}>
            {schedule.length ? `${schedule.length} lembretes por dia` : "Defina um horário de dormir depois do de acordar."}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {schedule.map(t => <span key={t} style={{ background: "var(--line)", borderRadius: 999, padding: "5px 11px", fontSize: 13, fontWeight: 600 }}>{fmt(t)}</span>)}
          </div>
        </div>
      </div>

      <InstallNotice {...{ perm, enableNotif, s: { ...s, notify: true } }} />
      <p style={{ color: "var(--mute)", fontSize: 12.5, lineHeight: 1.5, marginTop: 8 }}>
        Os lembretes são verificados enquanto o app está aberto ou ao voltar para ele. O iOS não permite alertas agendados com o app totalmente fechado sem um servidor de Web Push.
      </p>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
