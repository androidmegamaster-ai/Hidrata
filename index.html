<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hidrata</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hidrata">
<meta name="theme-color" content="#eaf6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06141c" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config = { darkMode: 'media' }</script>

<style>
  :root {
    --bg: #eaf6fb; --card: #ffffff; --ink: #0b2a38; --mute: #5d7886;
    --accent: #0ea5d9; --accent2: #5fd0f0; --line: rgba(11,42,56,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #06141c; --card: #0e2430; --ink: #e8f6fc; --mute: #8fb0c0;
            --accent: #38bdf8; --accent2: #7dd3fc; --line: rgba(255,255,255,.08); }
  }
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, #root { height: 100%; margin: 0; }
  html { background: var(--bg); }
  body {
    overscroll-behavior: none; position: fixed; inset: 0; width: 100%;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  input { -webkit-user-select: text; user-select: text; font-size: 16px; } /* 16px evita zoom do iOS */
  .app { height: 100%; display: flex; flex-direction: column;
         padding-top: env(safe-area-inset-top, 0px); }
  .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
            padding: 8px 20px 24px; }
  .card { background: var(--card); border-radius: 24px; padding: 18px; border: 1px solid var(--line); }
  .tabbar { display: flex; background: color-mix(in srgb, var(--card) 85%, transparent);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--line);
            padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
         font-size: 11px; font-weight: 600; color: var(--mute); background: none; border: 0; padding: 6px 0; }
  .tab.on { color: var(--accent); }
  .press { transition: transform .12s cubic-bezier(.3,.7,.4,1), filter .12s; }
  .press:active { transform: scale(.94); filter: brightness(.95); }
  .ring { transition: stroke-dashoffset .9s cubic-bezier(.22,1,.36,1); }
  .bar { transition: height .7s cubic-bezier(.22,1,.36,1); }
  @keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.08) } 100% { transform: scale(1) } }
  .pop { animation: pop .35s ease-out; }
  @keyframes fall { from { transform: translateY(-10vh) rotate(0); opacity: 1 } to { transform: translateY(110vh) rotate(360deg); opacity: 0 } }
  :root[data-theme="light"] { --bg: #eaf6fb; --card: #ffffff; --ink: #0b2a38; --mute: #5d7886; --line: rgba(11,42,56,.08); }
  :root[data-theme="dark"] { --bg: #06141c; --card: #0e2430; --ink: #e8f6fc; --mute: #8fb0c0; --line: rgba(255,255,255,.08); --accent: #38bdf8; --accent2: #7dd3fc; }
  .field { width: 100%; background: transparent; border: 0; outline: 0; text-align: right;
           color: var(--ink); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .ring, .bar, .pop { transition: none; animation: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------- Ícones (mesmos traçados do Lucide, inline p/ funcionar offline) ---------- */
const P = {
  droplet: <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>,
  bell: <><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></>,
  sliders: <><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/></>,
  chart: <><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></>,
  undo: <><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></>,
  plus: <path d="M5 12h14M12 5v14"/>,
  alert: <><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></>,
  share: <><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4M12 2v13"/></>,
  check: <path d="M20 6 9 17l-5-5"/>,
};
const Icon = ({ n, size = 22, sw = 2, className = "" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={className}>{P[n]}</svg>
);

/* ---------- Utilidades ---------- */
const dayKey = (d = new Date()) => d.toLocaleDateString("sv"); // YYYY-MM-DD local
const load = (k, f) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? f; } catch { return f; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fmt = (min) => `${String(Math.floor(min / 60) % 24).padStart(2, "0")}:${String(Math.round(min % 60)).padStart(2, "0")}`;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch {} };
const storageOK = (() => { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch { return false; } })();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}

const DEFAULTS = { weight: 70, manual: false, manualGoal: 2500, wake: "07:00", sleep: "23:00", notify: false, cups: [250, 300, 500], accent: 0, mode: "auto" };
const ACCENTS = [{ n: "Azul", a: "#0ea5d9", b: "#5fd0f0" }, { n: "Verde", a: "#10b981", b: "#6ee7b7" }, { n: "Roxo", a: "#8b5cf6", b: "#c4b5fd" }, { n: "Rosa", a: "#ec4899", b: "#f9a8d4" }];
const TYPES = [{ n: "Água", f: 1, e: "💧" }, { n: "Chá", f: 0.9, e: "🍵" }, { n: "Café", f: 0.8, e: "☕" }, { n: "Suco", f: 0.85, e: "🧃" }];
const eff = (e) => typeof e === "number" ? e : Math.round(e.ml * e.f);
const sumDay = (a) => (a || []).reduce((t, e) => t + eff(e), 0);
function getStreak(logs, goal) {
  const d = new Date(); let n = 0;
  if (sumDay(logs[dayKey(d)]) < goal) d.setDate(d.getDate() - 1);
  while (n < 3650 && sumDay(logs[dayKey(d)]) >= goal) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function calcGoal(s) { return s.manual ? s.manualGoal : Math.round((s.weight * 35) / 50) * 50; }
function calcSchedule(s, goal) {
  const a = toMin(s.wake), b = toMin(s.sleep);
  if (b <= a) return [];
  const n = Math.min(14, Math.max(4, Math.ceil(goal / 250)));
  const step = (b - a) / n;
  return Array.from({ length: n }, (_, i) => Math.round(a + step * (i + 1) - step / 2));
}

async function notify(title, body) {
  try {
    const reg = await navigator.serviceWorker?.ready;
    if (reg) return reg.showNotification(title, { body, icon: "icon-180.png", badge: "icon-180.png", tag: "hidrata" });
    new Notification(title, { body, icon: "icon-180.png" });
  } catch {}
}

/* ---------- App ---------- */
function App() {
  const [tab, setTab] = useState("hoje");
  const [s, setS] = useState(() => ({ ...DEFAULTS, ...load("hidrata_settings", {}) }));
  const [logs, setLogs] = useState(() => load("hidrata_logs", {}));
  const [perm, setPerm] = useState(typeof Notification !== "undefined" ? Notification.permission : "unsupported");
  const [pop, setPop] = useState(0);

  const [bonus, setBonus] = useState(() => load("hidrata_bonus", {}));
  const [dk, setDk] = useState(0);
  const baseGoal = calcGoal(s);
  const goal = baseGoal + (bonus[dayKey()] || 0);
  const today = dayKey();
  const entries = logs[today] || [];
  const total = sumDay(entries);
  const pct = Math.min(1, total / goal);
  const [party, setParty] = useState(false);
  const prevT = useRef(total);
  useEffect(() => { if (total >= goal && prevT.current < goal) { setParty(true); setTimeout(() => setParty(false), 3500); } prevT.current = total; }, [total]);
  const schedule = useMemo(() => calcSchedule(s, goal), [s.wake, s.sleep, goal]);

  useEffect(() => save("hidrata_settings", s), [s]);
  useEffect(() => save("hidrata_logs", logs), [logs]);
  useEffect(() => save("hidrata_bonus", bonus), [bonus]);
  useEffect(() => {
    const r = document.documentElement, c = ACCENTS[s.accent] || ACCENTS[0];
    if (s.mode === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", s.mode);
    if (s.accent) { r.style.setProperty("--accent", c.a); r.style.setProperty("--accent2", c.b); } else { r.style.removeProperty("--accent"); r.style.removeProperty("--accent2"); }
  }, [s.accent, s.mode]);
  useEffect(() => { // atalho Siri/Atalhos: ?add=250
    const v = +new URLSearchParams(location.search).get("add");
    if (v > 0 && v <= 2000) { add(v, 0); history.replaceState(null, "", location.pathname); }
  }, []);

  const add = (ml, k = dk) => { if (!ml) return; buzz(); setPop(p => p + 1); setLogs(l => ({ ...l, [today]: [...(l[today] || []), { ml, f: TYPES[k].f, k, t: Date.now() }] })); };
  const undo = () => { buzz(); setLogs(l => ({ ...l, [today]: (l[today] || []).slice(0, -1) })); };

  /* Verificador de lembretes: roda enquanto o app está aberto/em primeiro plano */
  const stateRef = useRef({});
  stateRef.current = { s, schedule, total, goal, perm, lastT: (entries[entries.length - 1] || {}).t || 0 };
  useEffect(() => {
    const check = () => {
      const { s, schedule, total, goal, perm, lastT } = stateRef.current;
      if (!s.notify || perm !== "granted" || total >= goal) return;
      const d = new Date(), now = d.getHours() * 60 + d.getMinutes(), key = dayKey(d);
      let sent = load("hidrata_sent", { day: key, t: [] });
      if (sent.day !== key) sent = { day: key, t: [] };
      const due = schedule.filter(t => t <= now && !sent.t.includes(t));
      if (!due.length) return;
      const last = due[due.length - 1];
      sent.t = [...sent.t, ...due]; save("hidrata_sent", sent);
      if (now - last <= 45 && Date.now() - lastT > 30 * 60000) {
        const falta = Math.max(0, goal - total);
        const a = toMin(s.wake), b = toMin(s.sleep), exp = goal * Math.min(1, Math.max(0, (now - a) / (b - a)));
        notify(total < exp - goal * 0.15 ? "⏰ Você está atrasado na meta" : "💧 Hora de beber água", `Faltam ${falta} ml para a meta de hoje.`);
      }
    };
    check();
    const id = setInterval(check, 30000);
    const vis = () => document.visibilityState === "visible" && check();
    document.addEventListener("visibilitychange", vis);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", vis); };
  }, []);

  const enableNotif = async () => {
    if (typeof Notification === "undefined") return;
    const r = await Notification.requestPermission();
    setPerm(r);
    if (r === "granted") { setS(x => ({ ...x, notify: true })); notify("Lembretes ativados", "Vamos te avisar para beber água."); }
  };

  return (
    <div className="app">
      {party && <div style={{ position: "fixed", inset: 0, pointerEvents: "none", overflow: "hidden", zIndex: 50 }}>
        {Array.from({ length: 22 }, (_, i) => <span key={i} style={{ position: "absolute", top: 0, left: `${(i * 37) % 100}%`, fontSize: 26, animation: `fall ${2 + (i % 5) * 0.3}s ease-in ${(i % 7) * 0.15}s forwards` }}>{i % 3 ? "💧" : "🎉"}</span>)}
      </div>}
      <header style={{ padding: "10px 20px 4px" }}>
        <h1 style={{ fontSize: 34, fontWeight: 800, letterSpacing: -0.5, margin: 0 }}>
          {tab === "hoje" ? "Hoje" : tab === "hist" ? "Histórico" : "Ajustes"}
        </h1>
        <p style={{ margin: "2px 0 0", color: "var(--mute)", fontSize: 14 }}>
          {new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" })}
        </p>
      </header>

      <main className="scroll">
        {!storageOK && (
          <div className="card" style={{ display: "flex", gap: 12, marginBottom: 16, background: "color-mix(in srgb, #ef4444 14%, var(--card))" }}>
            <Icon n="alert" className="shrink-0" />
            <div style={{ fontSize: 14, lineHeight: 1.4 }}><b>Este ambiente não permite salvar dados.</b> Os registros serão perdidos ao sair. Abra o app pelo seu endereço HTTPS no Safari ou pelo ícone da Tela de Início.</div>
          </div>
        )}
        {tab === "hoje" && <Today {...{ total, goal, pct, add, undo, entries, schedule, pop, s, perm, enableNotif, dk, setDk, bonus: bonus[today] || 0, setBonus: (v) => setBonus(b => ({ ...b, [today]: v })) }} />}
        {tab === "hist" && <History logs={logs} goal={baseGoal} setLogs={setLogs} />}
        {tab === "ajustes" && <Settings {...{ s, setS, goal: baseGoal, schedule, perm, enableNotif, logs, setLogs }} />}
      </main>

      <nav className="tabbar">
        {[["hoje", "droplet", "Hoje"], ["hist", "chart", "Histórico"], ["ajustes", "sliders", "Ajustes"]].map(([k, ic, lb]) => (
          <button key={k} className={"tab press " + (tab === k ? "on" : "")} onClick={() => { buzz(); setTab(k); }}>
            <Icon n={ic} size={24} />{lb}
          </button>
        ))}
      </nav>
    </div>
  );
}

function InstallNotice({ perm, enableNotif, s }) {
  if (isIOS && !isStandalone())
    return (
      <div className="card" style={{ display: "flex", gap: 12, marginBottom: 16, background: "color-mix(in srgb, #f59e0b 14%, var(--card))" }}>
        <Icon n="alert" className="shrink-0" />
        <div style={{ fontSize: 14, lineHeight: 1.4 }}>
          <b>Instale para receber lembretes.</b> No iPhone, notificações só funcionam com o app na Tela de Início: toque em <Icon n="share" size={15} className="inline -mt-1" /> Compartilhar → <b>Adicionar à Tela de Início</b> e abra por lá.
        </div>
      </div>
    );
  if (perm === "default" || (perm === "granted" && !s.notify))
    return (
      <button onClick={enableNotif} className="card press" style={{ width: "100%", display: "flex", gap: 12, alignItems: "center", marginBottom: 16, textAlign: "left", color: "var(--ink)" }}>
        <Icon n="bell" /><span style={{ fontSize: 15, fontWeight: 600 }}>Ativar lembretes de água</span>
      </button>
    );
  if (perm === "denied")
    return <div className="card" style={{ fontSize: 14, marginBottom: 16 }}>Notificações bloqueadas. Ative em Ajustes do iPhone → Notificações → Hidrata.</div>;
  return null;
}

function Today({ total, goal, pct, add, undo, entries, schedule, pop, s, perm, enableNotif, dk, setDk, bonus, setBonus }) {
  const lk = { background: "none", border: 0, color: "var(--accent)", fontWeight: 700, fontSize: 15, padding: "4px 8px" };
  const R = 100, C = 2 * Math.PI * R;
  const per = [0, 0, 0]; entries.forEach(e => { if (e.t) { const h = new Date(e.t).getHours(); per[h < 12 ? 0 : h < 18 ? 1 : 2] += eff(e); } });
  const dist = per.some(Boolean) ? `Manhã ${per[0]} · Tarde ${per[1]} · Noite ${per[2]} ml` : "";
  const frase = pct >= 1 ? "" : pct >= 0.75 ? "Quase lá, falta pouco!" : pct >= 0.5 ? "Metade do caminho!" : pct >= 0.25 ? "Bom ritmo, continue!" : "Vamos começar? 💧";
  const nextT = schedule.find(t => { const d = new Date(); return t > d.getHours() * 60 + d.getMinutes(); });
  return (
    <>
      <InstallNotice {...{ perm, enableNotif, s }} />
      <div className="card" style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "26px 18px" }}>
        <div key={pop} className={pop ? "pop" : ""} style={{ position: "relative", width: 240, height: 240 }}>
          <svg width="240" height="240" viewBox="0 0 240 240" style={{ transform: "rotate(-90deg)" }}>
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stopColor="var(--accent2)" /><stop offset="1" stopColor="var(--accent)" /></linearGradient></defs>
            <circle cx="120" cy="120" r={R} fill="none" stroke="var(--line)" strokeWidth="18" />
            <circle className="ring" cx="120" cy="120" r={R} fill="none" stroke="url(#g)" strokeWidth="18"
              strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C * (1 - pct)} />
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
            <Icon n={pct >= 1 ? "check" : "droplet"} size={26} className="" />
            <div style={{ fontSize: 44, fontWeight: 800, letterSpacing: -1, lineHeight: 1.1 }}>{total}<span style={{ fontSize: 18, color: "var(--mute)", fontWeight: 600 }}> ml</span></div>
            <div style={{ color: "var(--mute)", fontSize: 14 }}>de {goal} ml · {Math.round(pct * 100)}%</div>
          </div>
        </div>
        <p style={{ margin: "14px 0 0", color: "var(--mute)", fontSize: 14, textAlign: "center" }}>
          {pct >= 1 ? "Meta batida! Ótimo trabalho." : nextT != null && s.notify ? `Próximo lembrete às ${fmt(nextT)}` : `Faltam ${goal - total} ml`}{frase && <><br />{frase}</>}{dist && <><br />{dist}</>}
        </p>
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 16, overflowX: "auto" }}>
        {TYPES.map((t, i) => <button key={t.n} onClick={() => { buzz(); setDk(i); }} className="press" style={{ border: 0, borderRadius: 999, padding: "8px 14px", fontSize: 14, fontWeight: 600, whiteSpace: "nowrap", color: dk === i ? "#fff" : "var(--ink)", background: dk === i ? "var(--accent)" : "var(--card)" }}>{t.e} {t.n}</button>)}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10, fontSize: 14 }}>
        <span style={{ color: "var(--mute)" }}>🏃 Treino/calor: {bonus ? `+${bonus} ml na meta` : "sem ajuste"}</span>
        <span><button onClick={() => setBonus(bonus + 250)} style={lk}>+250</button>{bonus > 0 && <button onClick={() => setBonus(0)} style={lk}>Zerar</button>}</span>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12, margin: "16px 0" }}>
        {s.cups.map(ml => (
          <button key={ml} onClick={() => add(ml)} className="press"
            style={{ height: 96, borderRadius: 24, border: 0, color: "#fff", fontWeight: 800,
                     background: "linear-gradient(160deg, var(--accent2), var(--accent))",
                     boxShadow: "0 8px 20px -8px var(--accent)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2 }}>
            <Icon n="plus" size={18} sw={3} /><span style={{ fontSize: 22 }}>{ml}</span><span style={{ fontSize: 12, opacity: .85, marginTop: -4 }}>ml</span>
          </button>
        ))}
      </div>

      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: entries.length ? 10 : 0 }}>
          <b style={{ fontSize: 17 }}>Registros de hoje</b>
          <button onClick={undo} disabled={!entries.length} className="press"
            style={{ background: "none", border: 0, color: "var(--accent)", fontWeight: 600, opacity: entries.length ? 1 : .35, display: "flex", gap: 4, alignItems: "center", fontSize: 15 }}>
            <Icon n="undo" size={16} /> Desfazer
          </button>
        </div>
        {entries.length === 0
          ? <p style={{ color: "var(--mute)", margin: "8px 0 0", fontSize: 14 }}>Toque em um botão acima quando beber água.</p>
          : <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {entries.map((e, i) => <span key={i} style={{ background: "var(--line)", borderRadius: 999, padding: "6px 12px", fontSize: 14, fontWeight: 600 }}>{typeof e === "number" ? "💧" : TYPES[e.k]?.e} {e.ml ?? e} ml{e.t ? ` · ${new Date(e.t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}` : ""}</span>)}
            </div>}
      </div>
    </>
  );
}

function Trend({ logs, goal }) {
  const tot = (off) => { const d = new Date(); d.setDate(d.getDate() - off); return sumDay(logs[dayKey(d)]); };
  const days = Array.from({ length: 30 }, (_, i) => tot(29 - i));
  const w1 = days.slice(23).reduce((a, b) => a + b, 0), w0 = days.slice(16, 23).reduce((a, b) => a + b, 0);
  const diff = w0 ? Math.round(((w1 - w0) / w0) * 100) : null;
  const max = Math.max(goal, ...days);
  return (
    <div className="card" style={{ marginTop: 16 }}>
      <b>Últimos 30 dias</b>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 2, height: 80, marginTop: 12 }}>
        {days.map((t, i) => <div key={i} style={{ flex: 1, height: `${Math.max(4, (t / max) * 100)}%`, borderRadius: 3, background: t >= goal ? "var(--accent)" : "var(--line)" }} />)}
      </div>
      <p style={{ margin: "10px 0 0", fontSize: 14, color: "var(--mute)" }}>Esta semana: <b style={{ color: "var(--ink)" }}>{w1} ml</b> · anterior: {w0} ml{diff !== null && ` (${diff >= 0 ? "+" : ""}${diff}%)`}</p>
    </div>
  );
}

function Extra({ logs, goal }) {
  const streak = getStreak(logs, goal);
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1).getDay(), nd = new Date(y, m + 1, 0).getDate();
  const cells = [...Array(first).fill(null), ...Array.from({ length: nd }, (_, i) => i + 1)];
  return (<>
    <Trend logs={logs} goal={goal} />
    <div className="card" style={{ marginTop: 16 }}>
      <div style={{ fontSize: 26, fontWeight: 800 }}>🔥 {streak} {streak === 1 ? "dia" : "dias"} seguidos</div>
      <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
        {[3, 7, 14, 30].map(n => <span key={n} style={{ borderRadius: 999, padding: "6px 12px", fontSize: 13, fontWeight: 700, background: streak >= n ? "var(--accent)" : "var(--line)", color: streak >= n ? "#fff" : "var(--mute)" }}>🏅 {n} dias</span>)}
      </div>
    </div>
    <div className="card" style={{ marginTop: 16 }}>
      <b style={{ textTransform: "capitalize" }}>{now.toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}</b>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 6, marginTop: 10 }}>
        {cells.map((d, i) => { const p = d ? Math.min(1, sumDay(logs[dayKey(new Date(y, m, d))]) / goal) : 0;
          return <div key={i} style={{ aspectRatio: "1", borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 600, visibility: d ? "visible" : "hidden", background: p ? `color-mix(in srgb, var(--accent) ${Math.round(p * 100)}%, var(--line))` : "var(--line)", color: p > 0.6 ? "#fff" : "var(--ink)" }}>{d}</div>; })}
      </div>
    </div></>);
}

function History({ logs, goal, setLogs }) {
  const [open, setOpen] = useState(null);
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i));
    const k = dayKey(d); const t = sumDay(logs[k]);
    return { k, t, label: d.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", ""), isToday: i === 6 };
  });
  const max = Math.max(goal, ...days.map(d => d.t));
  const hit = days.filter(d => d.t >= goal).length;
  const avg = Math.round(days.reduce((a, d) => a + d.t, 0) / 7);
  return (
    <>
      <div className="card">
        <div style={{ display: "flex", alignItems: "flex-end", gap: 8, height: 190, position: "relative" }}>
          <div style={{ position: "absolute", left: 0, right: 0, bottom: `calc(${(goal / max) * 100}% * 0.86 + 22px)`, borderTop: "1.5px dashed var(--mute)", opacity: .5 }} />
          {days.map(d => (
            <div key={d.k} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", height: "100%", gap: 6 }}>
              <div style={{ width: "100%", height: "86%", display: "flex", alignItems: "flex-end" }}>
                <div className="bar" style={{ width: "100%", height: `${(d.t / max) * 100}%`, minHeight: d.t ? 6 : 3, borderRadius: 10,
                  background: d.t >= goal ? "linear-gradient(var(--accent2), var(--accent))" : d.isToday ? "var(--accent2)" : "var(--line)" }} />
              </div>
              <span style={{ fontSize: 12, fontWeight: d.isToday ? 800 : 500, color: d.isToday ? "var(--accent)" : "var(--mute)" }}>{d.label}</span>
            </div>
          ))}
        </div>
      </div>
      <button onClick={() => exportPDF(logs, goal)} className="press" style={{ width: "100%", marginTop: 16, border: 0, borderRadius: 16, padding: "14px 0", fontWeight: 700, fontSize: 16, color: "#fff", background: "linear-gradient(160deg, var(--accent2), var(--accent))" }}>Exportar histórico em PDF</button>
      <Extra logs={logs} goal={goal} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, margin: "16px 0" }}>
        <div className="card"><div style={{ color: "var(--mute)", fontSize: 13 }}>Média diária</div><div style={{ fontSize: 26, fontWeight: 800 }}>{avg} ml</div></div>
        <div className="card"><div style={{ color: "var(--mute)", fontSize: 13 }}>Metas batidas</div><div style={{ fontSize: 26, fontWeight: 800 }}>{hit}/7</div></div>
      </div>
      <div className="card">
        {[...days].reverse().map((d, i, a) => (
          <div key={d.k} onClick={() => setOpen(open === d.k ? null : d.k)} style={{ display: "flex", flexWrap: "wrap", justifyContent: "space-between", padding: "11px 0", borderBottom: i < a.length - 1 ? "1px solid var(--line)" : 0, fontSize: 15 }}>
            <span>{new Date(d.k + "T12:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "short" })}</span>
            <b style={{ color: d.t >= goal ? "var(--accent)" : "var(--ink)" }}>{d.t} ml</b>
            {open === d.k && <div onClick={e => e.stopPropagation()} style={{ width: "100%", display: "flex", flexWrap: "wrap", gap: 8, paddingTop: 10 }}>
              {(logs[d.k] || []).length === 0 && <span style={{ color: "var(--mute)", fontSize: 13 }}>Sem registros neste dia.</span>}
              {(logs[d.k] || []).map((e, j) => <span key={j} style={{ background: "var(--line)", borderRadius: 999, padding: "5px 6px 5px 12px", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}>{eff(e)} ml{e.t ? ` · ${new Date(e.t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}` : ""}<button onClick={() => setLogs(l => ({ ...l, [d.k]: l[d.k].filter((_, x) => x !== j) }))} style={{ border: 0, background: "var(--mute)", color: "var(--card)", borderRadius: "50%", width: 20, height: 20, fontSize: 11, lineHeight: 1 }}>✕</button></span>)}
            </div>}
          </div>
        ))}
      </div>
    </>
  );
}

async function exportPDF(logs, goal) {
  if (!window.jspdf) { alert("A biblioteca de PDF não carregou. Conecte-se à internet e tente de novo."); return; }
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
  const keys = Object.keys(logs).filter(k => (logs[k] || []).length).sort();
  const rows = keys.map(k => ({ k, t: sumDay(logs[k]), n: logs[k].length }));
  const hit = rows.filter(r => r.t >= goal).length;
  const avg = rows.length ? Math.round(rows.reduce((a, r) => a + r.t, 0) / rows.length) : 0;
  const best = rows.reduce((m, r) => Math.max(m, r.t), 0);
  const fd = (k) => new Date(k + "T12:00").toLocaleDateString("pt-BR");
  doc.setFillColor(14, 165, 217); doc.rect(0, 0, 210, 28, "F");
  doc.setTextColor(255); doc.setFontSize(20); doc.setFont("helvetica", "bold");
  doc.text("Hidrata - Histórico de hidratação", 14, 18);
  doc.setTextColor(40); doc.setFontSize(10); doc.setFont("helvetica", "normal");
  let y = 38;
  doc.text(`Gerado em ${new Date().toLocaleDateString("pt-BR")} · Meta diária de referência: ${goal} ml`, 14, y); y += 7;
  doc.text(rows.length ? `Período: ${fd(keys[0])} a ${fd(keys[keys.length - 1])} · ${rows.length} dias com registro` : "Sem registros.", 14, y); y += 7;
  doc.text(`Média: ${avg} ml/dia · Metas atingidas: ${hit} de ${rows.length} · Melhor dia: ${best} ml`, 14, y); y += 12;
  const head = () => {
    doc.setFillColor(14, 165, 217); doc.rect(14, y - 5, 182, 8, "F"); doc.setTextColor(255); doc.setFont("helvetica", "bold");
    doc.text("Data", 16, y); doc.text("Registros", 70, y); doc.text("Total (ml)", 105, y); doc.text("% da meta", 140, y); doc.text("Status", 172, y);
    doc.setFont("helvetica", "normal"); doc.setTextColor(40); y += 8;
  };
  head();
  [...rows].reverse().forEach((r, i) => {
    if (y > 278) { doc.addPage(); y = 20; head(); }
    if (i % 2 === 0) { doc.setFillColor(238, 247, 251); doc.rect(14, y - 5, 182, 7, "F"); }
    doc.setTextColor(40);
    doc.text(fd(r.k), 16, y); doc.text(String(r.n), 70, y); doc.text(String(r.t), 105, y); doc.text(`${Math.round((r.t / goal) * 100)}%`, 140, y);
    doc.setTextColor(...(r.t >= goal ? [16, 150, 90] : [170, 100, 20])); doc.text(r.t >= goal ? "Atingida" : "Abaixo", 172, y);
    y += 7;
  });
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setTextColor(120); doc.setFontSize(9); doc.text(`Página ${i} de ${pages}`, 105, 290, { align: "center" }); }
  const blob = doc.output("blob");
  const file = new File([blob], "hidrata-historico.pdf", { type: "application/pdf" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Histórico Hidrata" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  doc.save("hidrata-historico.pdf");
}

function Row({ label, children }) {
  return <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 0", borderBottom: "1px solid var(--line)", gap: 12 }}>
    <span style={{ fontSize: 16 }}>{label}</span><div style={{ minWidth: 90, textAlign: "right" }}>{children}</div></div>;
}

function Settings({ s, setS, goal, schedule, perm, enableNotif, logs, setLogs }) {
  const [txt, setTxt] = useState(""); const [msg, setMsg] = useState("");
  const btn = { flex: 1, border: 0, borderRadius: 14, padding: "12px 0", fontWeight: 700, background: "var(--accent)", color: "#fff", fontSize: 16 };
  const up = (k, v) => setS(x => ({ ...x, [k]: v }));
  const Toggle = ({ on, set }) => (
    <button onClick={() => set(!on)} className="press" aria-pressed={on}
      style={{ width: 51, height: 31, borderRadius: 999, border: 0, background: on ? "var(--accent)" : "var(--line)", position: "relative", transition: "background .2s" }}>
      <span style={{ position: "absolute", top: 2, left: on ? 22 : 2, width: 27, height: 27, borderRadius: "50%", background: "#fff", transition: "left .2s", boxShadow: "0 2px 4px rgba(0,0,0,.25)" }} />
    </button>);
  return (
    <>
      <div className="card" style={{ padding: "6px 18px" }}>
        <Row label="Meta manual"><Toggle on={s.manual} set={v => up("manual", v)} /></Row>
        {s.manual
          ? <Row label="Meta (ml)"><input className="field" type="number" inputMode="numeric" value={s.manualGoal} onChange={e => up("manualGoal", Math.max(500, +e.target.value || 0))} /></Row>
          : <Row label="Peso (kg)"><input className="field" type="number" inputMode="decimal" value={s.weight} onChange={e => up("weight", Math.max(20, +e.target.value || 0))} /></Row>}
        <div style={{ padding: "12px 0", color: "var(--mute)", fontSize: 14 }}>
          Meta diária: <b style={{ color: "var(--accent)" }}>{goal} ml</b>{!s.manual && " (35 ml por kg)"}
        </div>
      </div>

      <div className="card" style={{ padding: "6px 18px", marginTop: 16 }}>
        <Row label="Acordo às"><input className="field" type="time" value={s.wake} onChange={e => up("wake", e.target.value)} /></Row>
        <Row label="Durmo às"><input className="field" type="time" value={s.sleep} onChange={e => up("sleep", e.target.value)} /></Row>
        <Row label="Lembretes">
          <Toggle on={s.notify && perm === "granted"} set={v => v ? (perm === "granted" ? up("notify", true) : enableNotif()) : up("notify", false)} />
        </Row>
        <div style={{ padding: "12px 0" }}>
          <div style={{ color: "var(--mute)", fontSize: 14, marginBottom: 8 }}>
            {schedule.length ? `${schedule.length} lembretes por dia` : "Defina um horário de dormir depois do de acordar."}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {schedule.map(t => <span key={t} style={{ background: "var(--line)", borderRadius: 999, padding: "5px 11px", fontSize: 13, fontWeight: 600 }}>{fmt(t)}</span>)}
          </div>
        </div>
      </div>

      <div className="card" style={{ padding: "6px 18px", marginTop: 16 }}>
        {s.cups.map((c, i) => <Row key={i} label={`Copo ${i + 1} (ml)`}><input className="field" type="number" inputMode="numeric" value={c} onChange={e => setS(x => ({ ...x, cups: x.cups.map((v, j) => j === i ? Math.min(2000, Math.max(0, +e.target.value || 0)) : v) }))} /></Row>)}
      </div>
      <div className="card" style={{ marginTop: 16 }}>
        <b>Backup</b>
        <div style={{ display: "flex", gap: 10, margin: "10px 0" }}>
          <button className="press" style={btn} onClick={async () => { const data = JSON.stringify({ s, logs }); try { if (navigator.share) await navigator.share({ text: data }); else await navigator.clipboard.writeText(data); setMsg("Backup pronto! Guarde o texto (ex.: em Notas)."); } catch { setMsg("Não foi possível exportar."); } }}>Exportar</button>
          <button className="press" style={btn} onClick={() => { try { const o = JSON.parse(txt); if (!o.logs) throw 0; setLogs(o.logs); if (o.s) setS({ ...DEFAULTS, ...o.s }); setMsg("Dados restaurados!"); } catch { setMsg("Texto de backup inválido."); } }}>Importar</button>
        </div>
        <textarea value={txt} onChange={e => setTxt(e.target.value)} placeholder="Cole aqui o backup para importar" rows={3} style={{ width: "100%", borderRadius: 12, border: "1px solid var(--line)", background: "transparent", color: "var(--ink)", padding: 10, fontSize: 16, userSelect: "text", WebkitUserSelect: "text" }} />
        {msg && <p style={{ margin: "8px 0 0", fontSize: 13, color: "var(--mute)" }}>{msg}</p>}
      </div>
      <div className="card" style={{ marginTop: 16 }}>
        <b>Aparência</b>
        <div style={{ display: "flex", gap: 10, margin: "12px 0" }}>
          {ACCENTS.map((c, i) => <button key={c.n} aria-label={c.n} onClick={() => up("accent", i)} style={{ width: 40, height: 40, borderRadius: "50%", border: (s.accent || 0) === i ? "3px solid var(--ink)" : "3px solid transparent", background: c.a }} />)}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          {[["auto", "Auto"], ["light", "Claro"], ["dark", "Escuro"]].map(([k, l]) => <button key={k} className="press" onClick={() => up("mode", k)} style={{ flex: 1, border: 0, borderRadius: 12, padding: "10px 0", fontWeight: 600, fontSize: 15, background: (s.mode || "auto") === k ? "var(--accent)" : "var(--line)", color: (s.mode || "auto") === k ? "#fff" : "var(--ink)" }}>{l}</button>)}
        </div>
      </div>
      <div className="card" style={{ marginTop: 16, fontSize: 13.5, lineHeight: 1.5, color: "var(--mute)" }}>
        <b style={{ color: "var(--ink)" }}>Atalho com a Siri</b><br />No app Atalhos, crie a ação “Abrir URLs” com <span style={{ userSelect: "text", WebkitUserSelect: "text", wordBreak: "break-all" }}>{location.origin + location.pathname}?add=250</span> e dê um nome para chamá-lo por voz.
      </div>
      <InstallNotice {...{ perm, enableNotif, s: { ...s, notify: true } }} />
      <p style={{ color: "var(--mute)", fontSize: 12.5, lineHeight: 1.5, marginTop: 8 }}>
        Os lembretes são verificados enquanto o app está aberto ou ao voltar para ele. O iOS não permite alertas agendados com o app totalmente fechado sem um servidor de Web Push.
      </p>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
